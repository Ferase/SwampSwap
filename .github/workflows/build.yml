name: Build SwampSwap

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: SwampSwap_Linux_x86_64
            archive: SwampSwap_Linux_x86_64.tar.gz
            appimage_name: SwampSwap_x86_64.AppImage
            appimage_tool: appimagetool-x86_64.AppImage
            croc_binary_suffix: Linux-64bit.tar.gz

          - os: windows-latest
            artifact_name: SwampSwap_Windows_x86_64
            archive: SwampSwap_Windows_x86_64.zip
            croc_binary_suffix: Windows-64bit.zip

          - os: macos-15-intel
            artifact_name: SwampSwap_macOS_x86_64
            archive: SwampSwap_macOS_x86_64.tar.gz
            croc_binary_suffix: macOS-64bit.tar.gz

          - os: macos-latest
            artifact_name: SwampSwap_macOS_arm64
            archive: SwampSwap_macOS_arm64.tar.gz
            croc_binary_suffix: macOS-ARM64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (Windows/macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies (Windows/macOS)
        if: runner.os != 'Linux'
        run: pip install -r requirements.txt

      - name: Download croc (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          CROC_VERSION="11.5.4"
          mkdir -p croc
          curl -sL "https://github.com/schollz/croc/releases/download/v${CROC_VERSION}/croc_v${CROC_VERSION}_${{ matrix.croc_binary_suffix }}" \
            -o croc_download.tar.gz
          tar -xzf croc_download.tar.gz -C croc croc
          chmod +x croc/croc

      - name: Download croc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $CrocVersion = "11.5.4"
          $CrocUrl = "https://github.com/schollz/croc/releases/download/v$CrocVersion/croc_v${CrocVersion}_${{ matrix.croc_binary_suffix }}"

          New-Item -ItemType Directory -Force -Path croc

          Write-Host "Downloading: $CrocUrl"
          Invoke-WebRequest `
            -Uri $CrocUrl `
            -OutFile croc_download.zip `
            -UseBasicParsing

          Expand-Archive -Path croc_download.zip -DestinationPath croc

      - name: Build with PyInstaller (Windows/macOS)
        if: runner.os != 'Linux'
        run: pyinstaller build.spec

      - name: Build with PyInstaller (manylinux)
        if: runner.os == 'Linux'
        uses: docker://quay.io/pypa/manylinux_2_28_x86_64:latest
        with:
          args: >-
            bash -c "
              cd /github/workspace &&
              yum install -y xcb-util-cursor xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-wm mesa-libGL &&
              /opt/python/cp311-cp311/bin/pip install aqtinstall &&
              /opt/python/cp311-cp311/bin/aqt install-qt linux desktop 6.7.0 gcc_64 -O /qt &&
              export QMAKE=/qt/6.7.0/gcc_64/bin/qmake &&
              /opt/python/cp311-cp311/bin/pip install -r requirements.txt &&
              /opt/python/cp311-cp311/bin/pyinstaller build.spec
            "
            
      - name: Build AppImage
        if: runner.os == 'Linux'
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/${{ matrix.appimage_tool }}" \
            -O appimagetool
          chmod +x appimagetool

          mkdir -p SwampSwap.AppDir/usr/bin
          mkdir -p SwampSwap.AppDir/usr/share/metainfo
          mkdir -p SwampSwap.AppDir/usr/share/icons/hicolor/256x256/apps

          cp -r dist/SwampSwap SwampSwap.AppDir/usr/bin/SwampSwap
          cp AppRun SwampSwap.AppDir/AppRun
          cp SwampSwap.desktop SwampSwap.AppDir/SwampSwap.desktop
          cp SwampSwap.png SwampSwap.AppDir/io.github.Ferase.SwampSwap.png

          cp metainfo.xml \
            SwampSwap.AppDir/usr/share/metainfo/io.github.Ferase.SwampSwap.metainfo.xml

          cp SwampSwap.png \
            SwampSwap.AppDir/usr/share/icons/hicolor/256x256/apps/io.github.Ferase.SwampSwap.png

          ARCH=$(uname -m) ./appimagetool --appimage-extract-and-run \
            --updateinformation "gh-releases-zsync|Ferase|SwampSwap|latest|${{ matrix.appimage_name }}.zsync" \
            SwampSwap.AppDir \
            "${{ matrix.appimage_name }}"

      - name: Upload AppImage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: appimage_${{ matrix.artifact_name }}
          path: |
            ${{ matrix.appimage_name }}
            ${{ matrix.appimage_name }}.zsync
          retention-days: 30

      - name: Archive build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist .

      - name: Archive build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath '${{ matrix.artifact_name }}.zip'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true