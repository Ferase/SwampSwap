name: Build SwampSwap

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: SwampSwap_Linux
            archive: SwampSwap_Linux.tar.gz
            spec_file: build_onedir.spec

          - os: windows-latest
            artifact_name: SwampSwap_Windows
            archive: SwampSwap_Windows.zip
            spec_file: build_onedir.spec

          - os: macos-latest
            artifact_name: SwampSwap_macOS
            archive: SwampSwap_macOS.tar.gz
            spec_file: build_onedir.spec

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller ${{ matrix.spec_file }}

      - name: Archive build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist .

      - name: Archive build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true