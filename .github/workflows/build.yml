name: Build SwampSwap

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: SwampSwap_Linux_x86_64
            archive: SwampSwap_Linux_x86_64.tar.gz
            appimage_name: SwampSwap_x86_64.AppImage
            appimage_tool: appimagetool-x86_64.AppImage
            spec_file: build_onedir.spec

          - os: ubuntu-24.04-arm
            artifact_name: SwampSwap_Linux_aarch64
            archive: SwampSwap_Linux_aarch64.tar.gz
            appimage_name: SwampSwap_aarch64.AppImage
            appimage_tool: appimagetool-aarch64.AppImage
            spec_file: build_onedir.spec

          - os: windows-latest
            artifact_name: SwampSwap_Windows_x86_64
            archive: SwampSwap_Windows_x86_64.zip
            spec_file: build_onedir.spec

          - os: macos-15-intel
            artifact_name: SwampSwap_macOS_x86_64
            archive: SwampSwap_macOS_x86_64.tar.gz
            spec_file: build_onedir.spec

          - os: macos-latest
            artifact_name: SwampSwap_macOS_arm64
            archive: SwampSwap_macOS_arm64.tar.gz
            spec_file: build_onedir.spec

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller ${{ matrix.spec_file }}

      - name: Build AppImage
        if: runner.os == "Linux"
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/${{ matrix.appimage_tool }}" \
            -O appimagetool
          chmod +x appimagetool

          mkdir -p SwampSwap.AppDir/usr/bin

          cp -r dist/SwampSwap SwampSwap.AppDir/usr/bin/SwampSwap

          cp AppRun SwampSwap.AppDir/AppRun
          cp SwampSwap.desktop SwampSwap.AppDir/SwampSwap.desktop
          cp SwampSwap.png SwampSwap.AppDir/SwampSwap.png

          ARCH=$(uname -m) ./appimagetool --appimage-extract-and-run \
            SwampSwap.AppDir \
            "${{ matrix.appimage_name }}"

      - name: Upload AppImage artifact
        if: runner.os == "Linux"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.appimage_name }}
          path: ${{ matrix.appimage_name }}
          retention-days: 30

      - name: Archive build (Linux/macOS)
        if: runner.os != "Windows"
        run: |
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist .

      - name: Archive build (Windows)
        if: runner.os == "Windows"
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, "refs/tags/")

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true